# NOTE:
# example: https://github.com/MetaCubeX/mihomo/blob/Meta/docs/config.yaml
# doc: https://wiki.metacubex.one/config/

mixed-port: 9393 # HTTP(S) 和 SOCKS 代理混合端口
redir-port: 9392 # 透明代理端口，用于 Linux 和 MacOS
mode: rule
allow-lan: false # 局域网连接

geox-url:
  geoip: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat"
  geosite: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"
  mmdb: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb"
geo-auto-update: true
geo-update-interval: 24 # 更新间隔，单位小时

log-level: info
ipv6: true

external-controller: 0.0.0.0:9391
external-ui-url: "https://github.com/MetaCubeX/metacubexd/archive/refs/heads/gh-pages.zip"
external-ui: ui
secret: "xx11"

profile:
  store-selected: true # 储存 API 对策略组的选择，以供下次启动时使用
  store-fake-ip: true # 储存 fakeip 映射表，域名再次发生连接时，使用原有映射地址

tun:
  enable: true
  stack: mips # system/gvisor/mixed/mips
  # 劫持所有dns解析请求
  dns-hijack:
    - 0.0.0.0:53
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true

# NOTE: DNS 请求逻辑：https://wiki.metacubex.one/config/dns/diagram/#_3
dns:
  enable: true
  ipv6: true
  prefer-h3: false # http3
  ipv6-timeout: 100
  # 启用 DNS 服务并让其在 53 端口监听来自任意网络的 DNS 请求
  # 如果你的设备并不需要向其他设备提供解析服务可设置为 127.0.0.1:53 仅监听本机的 DNS 解析报文
  # 使用docker等容器时，需要设置为0.0.0.0:53，否则会直接丢弃容器内的dns请求
  listen: 0.0.0.0:53

  # 配置后面的nameserver、fallback和nameserver-policy向dns服务器的连接过程是否遵守遵守rules规则
  # 如果为false（默认值）则这三部分的dns服务器在未特别指定的情况下会直连
  # 如果为true，将会按照rules的规则匹配链接方式（走代理或直连），如果有特别指定则任然以指定值为准
  # 仅当proxy-server-nameserver非空时可以开启此选项, 强烈不建议和prefer-h3一起使用
  # 此外，这三者配置中的dns服务器如果出现域名会采用default-nameserver配置项解析，也请确保正确配置default-nameserver
  respect-rules: true
  # 用于解析 dns 服务器域名（如：https://dns.alidns.com/dns-query）的 dns，必须ip，可加密
  default-nameserver:
    - https://223.5.5.5/dns-query
    - https://223.6.6.6/dns-query
  # 仅用于解析代理节点的域名，只能使用纯 IP 地址，可使用加密 DNS
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  # 优先于 nameserver 查询
  nameserver-policy:
    "rule-set:lan_non_ip,direct_non_ip":
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
    "rule-set:apple_cdn,apple_cn_non_ip,microsoft_cdn_non_ip":
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
    "rule-set:domestic_non_ip":
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
    "geosite:private,apple@cn":
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
    "geosite:geolocation-cn":
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
    "geosite:category-ads-all":
      - rcode://success
  # 未命中 nameserver-policy 的
  nameserver:
    - "https://cloudflare-dns.com/dns-query"
    - "https://dns.google/dns-query"
  # 用于 direct 出口域名解析的 DNS 服务器，如果不填则遵循 nameserver-policy/nameserver
  direct-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-range6: fdfe:dcba:9876::1/64
  # 黑名单模式 fake-ip-filter 里的不会返回fakeip
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - rule-set:direct_non_ip
    - geosite:private

proxy-providers:
  provider1:
    type: http
    url: https://example.com
    proxy: DIRECT
    health-check:
      enable: true
      url: https://cp.cloudflare.com/generate_204
      interval: 300
      timeout: 1000
      lazy: true
  providerA:
    type: file
    path: ./proxy_providers/proxy_1.yaml
    health-check:
      enable: true
      url: https://cp.cloudflare.com/generate_204
      interval: 300
      timeout: 1000
      lazy: true

proxy-groups:
  - name: cuckoo
    type: select
    use:
      - provider1
    url: https://cp.cloudflare.com/generate_204
    interval: 39

  - name: godwit
    type: select
    use:
      - provider1
    url: https://cp.cloudflare.com/generate_204
    interval: 39

  - name: seagull
    type: select
    use:
      - provider1
    url: https://cp.cloudflare.com/generate_204
    interval: 39

  - name: urltest
    type: url-test
    use:
      - provider1
    url: https://cp.cloudflare.com/generate_204
    interval: 39

  - name: albatross
    type: select
    proxies: [urltest, cuckoo, godwit, seagull]

  - name: ai
    type: select
    proxies: [albatross, seagull, godwit, cuckoo]

  - name: stream
    type: select
    proxies: [albatross, cuckoo, godwit, seagull]

  - name: stream-cn
    type: select
    proxies: [DIRECT, cuckoo, godwit, seagull]

  - name: apple
    type: select
    proxies: [albatross, cuckoo, godwit, seagull, DIRECT]

  - name: apple-cn
    type: select
    proxies: [DIRECT, cuckoo, godwit, seagull]

rule-providers:
  #NOTE: Apple
  apple_services:
    type: http
    behavior: classical
    format: text
    interval: 43200
    url: https://ruleset.skk.moe/Clash/non_ip/apple_services.txt
    path: ./sukkaw_ruleset/apple_services.txt
  apple_ai:
    type: http
    behavior: domain
    format: text
    interval: 43200
    url: https://ruleset.skk.moe/Clash/non_ip/apple_intelligence.txt
    path: ./sukkaw_ruleset/apple_ai.txt
  # 云上贵州
  apple_cn_non_ip:
    type: http
    behavior: classical
    format: text
    interval: 43200
    url: https://ruleset.skk.moe/Clash/non_ip/apple_cn.txt
    path: ./sukkaw_ruleset/apple_cn_non_ip.txt
  # aplle 国内备案的cdn
  apple_cdn:
    type: http
    behavior: domain
    format: text
    interval: 43200
    url: https://ruleset.skk.moe/Clash/domainset/apple_cdn.txt
    path: ./sukkaw_ruleset/apple_cdn.txt
  apple_services_ip:
    type: http
    behavior: domain
    format: text
    interval: 43200
    url: https://ruleset.skk.moe/Clash/ip/apple_services.txt
    path: ./sukkaw_ruleset/apple_services_ip.txt

  #NOTE: microsoft
  # 微软国内备案的cdn
  microsoft_cdn_non_ip:
    type: http
    behavior: classical
    format: text
    interval: 43200
    url: https://ruleset.skk.moe/Clash/non_ip/microsoft_cdn.txt
    path: ./sukkaw_ruleset/microsoft_cdn_non_ip.txt
  # 微软服务
  microsoft_non_ip:
    type: http
    behavior: classical
    format: text
    interval: 43200
    url: https://ruleset.skk.moe/Clash/non_ip/microsoft.txt
    path: ./sukkaw_ruleset/microsoft_non_ip.txt

  #NOTE: 国外流媒体
  stream_non_ip:
    type: http
    behavior: classical
    format: text
    interval: 43200
    url: https://ruleset.skk.moe/Clash/non_ip/stream.txt
    path: ./sukkaw_ruleset/stream_non_ip.txt
  stream_ip:
    type: http
    behavior: classical
    format: text
    interval: 43200
    url: https://ruleset.skk.moe/Clash/ip/stream.txt
    path: ./sukkaw_ruleset/stream_ip.txt

  stream_cn:
    type: inline
    behavior: classical
    payload:
      - "DOMAIN-SUFFIX,iqiyi.com"

  #NOTE: AI
  ai_non_ip:
    type: http
    behavior: classical
    format: text
    interval: 43200
    url: https://ruleset.skk.moe/Clash/non_ip/ai.txt
    path: ./sukkaw_ruleset/ai_non_ip.txt

  #NOTE: MISC
  # 常见国内域名
  domestic_non_ip:
    type: http
    behavior: classical
    format: text
    interval: 43200
    url: https://ruleset.skk.moe/Clash/non_ip/domestic.txt
    path: ./sukkaw_ruleset/domestic_non_ip.txt
  # 需要走直连的进程和域名，包含大部分 BT 和 BT Based 下载器的进程名
  direct_non_ip:
    type: http
    behavior: classical
    format: text
    interval: 43200
    url: https://ruleset.skk.moe/Clash/non_ip/direct.txt
    path: ./sukkaw_ruleset/direct_non_ip.txt
  # 常见国外域名
  global_non_ip:
    type: http
    behavior: classical
    format: text
    interval: 43200
    url: https://ruleset.skk.moe/Clash/non_ip/global.txt
    path: ./sukkaw_ruleset/global_non_ip.txt

  #NOTE: local
  lan_non_ip:
    type: http
    behavior: classical
    format: text
    interval: 43200
    url: https://ruleset.skk.moe/Clash/non_ip/lan.txt
    path: ./sukkaw_ruleset/lan_non_ip.txt
  lan_ip:
    type: http
    behavior: classical
    format: text
    interval: 43200
    url: https://ruleset.skk.moe/Clash/ip/lan.txt
    path: ./sukkaw_ruleset/lan_ip.txt

  #NOTE: china ip
  china_ip:
    type: http
    behavior: ipcidr
    format: text
    interval: 43200
    url: https://ruleset.skk.moe/Clash/ip/china_ip.txt
    path: ./sukkaw_ruleset/china_ip.txt
  china_ip_ipv6:
    type: http
    behavior: ipcidr
    format: text
    interval: 43200
    url: https://ruleset.skk.moe/Clash/ip/china_ip_ipv6.txt
    path: ./sukkaw_ruleset/china_ipv6.txt

rules:
  # direct
  - RULE-SET,lan_non_ip,DIRECT
  - GEOSITE,private,DIRECT
  - RULE-SET,direct_non_ip,DIRECT
    # AI
  - RULE-SET,ai_non_ip,ai
  - GEOSITE,category-ai-!cn,ai
    # stream
  - RULE-SET,stream_non_ip,stream
  - GEOSITE,bilibili,stream-cn
  - RULE-SET,stream_cn,stream-cn
    # apple ms
  - RULE-SET,apple_cdn,apple-cn
  - RULE-SET,apple_cn_non_ip,apple-cn
  - RULE-SET,microsoft_cdn_non_ip,apple-cn
  - RULE-SET,apple_services,apple
  - RULE-SET,apple_ai,apple
  - RULE-SET,microsoft_non_ip,apple
    # general
  - RULE-SET,domestic_non_ip,DIRECT
  - RULE-SET,global_non_ip,albatross
  - GEOSITE,gfw,albatross
  - GEOSITE,geolocation-cn,DIRECT
  - GEOSITE,geolocation-!cn,albatross
  - GEOSITE,category-ads-all,REJECT-DROP
  # NOTE: ip
  - RULE-SET,lan_ip,DIRECT,no-resolve
  - GEOIP,private,DIRECT,no-resolve

  - RULE-SET,apple_services_ip,apple
  - RULE-SET,stream_ip,stream

  - GEOIP,cn,DIRECT
  - RULE-SET,china_ip,DIRECT
  - RULE-SET,china_ip_ipv6,DIRECT
  - MATCH,albatross
